name-template: 'Next Release'

autolabeler:
  - label: 'feature'
    title:
      - '/^\[Feature\]/'
      - '/^feat(\(.*\))?:/'
    branch:
      - '/^feature\//'
  - label: 'fix'
    title:
      - '/^\[Fix\]/'
      - '/^fix(\(.*\))?:/'
    branch:
      - '/^fix\//'
  - label: 'refactor'
    title:
      - '/^\[Refactor\]/'
      - '/^refactor(\(.*\))?:/'
    branch:
      - '/^refactor\//'
  - label: 'docs'
    title:
      - '/^\[Docs\]/'
      - '/^docs(\(.*\))?:/'
    branch:
      - '/^docs\//'
  - label: 'chore'
    title:
      - '/^\[Chore\]/'
      - '/^chore(\(.*\))?:/'
    branch:
      - '/^chore\//'
  - label: 'test'
    title:
      - '/^\[Test\]/'
      - '/^test(\(.*\))?:/'
    branch:
      - '/^test\//'

category-template: |
  ### $TITLE

categories:
  - title: '🚀 新機能 / Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 バグ修正 / Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bug'
  - title: '🛠️ リファクタリング / Refactoring'
    when:
      labels:
        - 'refactor'
  - title: '📝 ドキュメント / Documentation'
    when:
      labels:
        - 'docs'
        - 'documentation'
  - title: '📦 保守・ビルド・CI / Maintenance & Chore'
    when:
      labels:
        - 'chore'
        - 'test'
        - 'dependencies'

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

template: |
  ## 変更内容 / What's Changed

  $CHANGES
