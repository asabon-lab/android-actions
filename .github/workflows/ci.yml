name: CI

on:
  push:
    branches: [main]
    paths:
      - 'setup-keystore/**'
      - 'promote-play/**'
      - 'publish-release/**'
      - 'analyze-build-log/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'setup-keystore/**'
      - 'promote-play/**'
      - 'publish-release/**'
      - 'analyze-build-log/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  test-python:
    name: Test Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade google-api-python-client google-auth

      - name: Run Unit Tests (promote-play)
        run: |
          python -m unittest discover -s promote-play/scripts -p "test_*.py"

      - name: Run Unit Tests (analyze-build-log)
        run: |
          python -m unittest discover -s analyze-build-log/scripts -p "test_*.py"

  test-actions:
    name: Test Composite Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test setup-keystore action
        id: test_keystore
        uses: ./setup-keystore
        with:
          keystore-base64: 'dGVzdC1rZXlzdG9yZS1jb250ZW50' # base64 for "test-keystore-content"
          keystore-path: 'build/test-keystore.jks'

      - name: Verify setup-keystore output
        run: |
          if [ ! -f "build/test-keystore.jks" ]; then
            echo "::error::Keystore file was not created!"
            exit 1
          fi
          CONTENT=$(cat "build/test-keystore.jks")
          if [ "$CONTENT" != "test-keystore-content" ]; then
            echo "::error::Decoded content mismatch: $CONTENT"
            exit 1
          fi
          echo "setup-keystore verified successfully!"

      - name: Prepare dummy build log
        run: |
          mkdir -p build
          cat << 'EOF' > build/dummy_build.log
          > Task :app:preBuild UP-TO-DATE
          > Task :app:assembleDebug UP-TO-DATE
          BUILD SUCCESSFUL in 2s
          EOF

      - name: Test analyze-build-log action
        id: test_analyzer
        uses: ./analyze-build-log
        with:
          log-file-path: 'build/dummy_build.log'
          report-path: 'build/dummy_report.md'

      - name: Verify analyze-build-log output
        run: |
          if [ ! -f "build/dummy_report.md" ]; then
            echo "::error::Analysis report was not generated!"
            exit 1
          fi
          if [ "${{ steps.test_analyzer.outputs.error-count }}" != "0" ]; then
            echo "::error::Expected error-count 0, got ${{ steps.test_analyzer.outputs.error-count }}"
            exit 1
          fi
          echo "analyze-build-log verified successfully!"
