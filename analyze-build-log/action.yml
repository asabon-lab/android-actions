name: 'Android Build Log Analyzer'
description: 'Analyze Android build logs for errors, warnings, and performance, annotating issues and generating summary reports'
author: 'asabon-lab'

inputs:
  log-file-path:
    description: 'Path to the Android build log file to analyze'
    required: true
  report-path:
    description: 'Path to save the analysis report in Markdown format (optional)'
    required: false
    default: ''
  enable-summary:
    description: 'Whether to append the analysis report to GitHub Step Summary (default: true)'
    required: false
    default: 'true'
  emit-annotations:
    description: 'Whether to emit GitHub workflow command annotations (::error, ::warning) (default: true)'
    required: false
    default: 'true'

outputs:
  report-path:
    description: 'Path of the saved analysis report file'
    value: ${{ steps.analyze.outputs.report-path }}
  error-count:
    description: 'Number of detected build errors'
    value: ${{ steps.analyze.outputs.error-count }}
  warning-count:
    description: 'Number of detected build warnings'
    value: ${{ steps.analyze.outputs.warning-count }}

runs:
  using: 'composite'
  steps:
    - name: Analyze Build Log
      id: analyze
      shell: bash
      env:
        LOG_FILE_PATH: ${{ inputs.log-file-path }}
        REPORT_PATH: ${{ inputs.report-path }}
        ENABLE_SUMMARY: ${{ inputs.enable-summary }}
        EMIT_ANNOTATIONS: ${{ inputs.emit-annotations }}
      run: |
        ARGS=(
          "--log-file-path" "$LOG_FILE_PATH"
        )
        if [ -n "$REPORT_PATH" ]; then
          ARGS+=("--report-path" "$REPORT_PATH")
        fi
        if [ "$ENABLE_SUMMARY" = "false" ]; then
          ARGS+=("--disable-summary")
        fi
        if [ "$EMIT_ANNOTATIONS" = "false" ]; then
          ARGS+=("--disable-annotations")
        fi

        if command -v python3 >/dev/null 2>&1; then
          python3 "${{ github.action_path }}/scripts/analyze_build_log.py" "${ARGS[@]}"
        else
          python "${{ github.action_path }}/scripts/analyze_build_log.py" "${ARGS[@]}"
        fi
