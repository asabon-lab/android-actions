name: 'Publish GitHub Release'
description: 'Create, update, or publish GitHub Releases with assets and support for draft/prerelease promotion'
author: 'asabon-lab'

inputs:
  github-token:
    description: 'GitHub token with contents:write permission'
    required: false
    default: ${{ github.token }}
  tag-name:
    description: 'Tag name for the release (e.g. v1.0.0)'
    required: true
  release-title:
    description: 'Title for the release (defaults to tag-name)'
    required: false
    default: ''
  prerelease:
    description: 'Whether this release is a pre-release (true or false)'
    required: false
    default: 'false'
  draft:
    description: 'Whether to create or keep this release as a draft (true or false)'
    required: false
    default: 'false'
  make-latest:
    description: 'Whether to mark as latest release (true, false, legacy, or auto)'
    required: false
    default: 'auto'
  generate-notes:
    description: 'Automatically generate release notes if creating a new release (true or false)'
    required: false
    default: 'true'
  artifacts:
    description: 'Path or glob pattern of artifacts to upload (e.g. release-artifacts/*)'
    required: false
    default: ''
  update-existing-draft:
    description: 'If true and a draft release exists, update and publish the existing draft'
    required: false
    default: 'true'

outputs:
  release-url:
    description: 'HTML URL of the GitHub Release'
    value: ${{ steps.publish.outputs.release_url }}
  release-id:
    description: 'GitHub Release ID'
    value: ${{ steps.publish.outputs.release_id }}
  tag-name:
    description: 'Target tag name'
    value: ${{ inputs.tag-name }}

runs:
  using: 'composite'
  steps:
    - name: Publish or Update GitHub Release
      id: publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TAG_NAME: ${{ inputs.tag-name }}
        INPUT_TITLE: ${{ inputs.release-title }}
        IS_PRERELEASE: ${{ inputs.prerelease }}
        IS_DRAFT: ${{ inputs.draft }}
        MAKE_LATEST: ${{ inputs.make-latest }}
        GEN_NOTES: ${{ inputs.generate-notes }}
        ARTIFACTS_PATTERN: ${{ inputs.artifacts }}
        UPDATE_DRAFT: ${{ inputs.update-existing-draft }}
        REPOSITORY: ${{ github.repository }}
      run: |
        ARGS=(
          "--tag-name" "$TAG_NAME"
          "--make-latest" "$MAKE_LATEST"
          "--repository" "$REPOSITORY"
        )

        if [ -n "$INPUT_TITLE" ]; then
          ARGS+=("--release-title" "$INPUT_TITLE")
        fi

        if [ "$IS_PRERELEASE" = "true" ]; then
          ARGS+=("--prerelease" "true")
        else
          ARGS+=("--prerelease" "false")
        fi

        if [ "$IS_DRAFT" = "true" ]; then
          ARGS+=("--draft" "true")
        else
          ARGS+=("--draft" "false")
        fi

        if [ "$GEN_NOTES" = "true" ]; then
          ARGS+=("--generate-notes" "true")
        else
          ARGS+=("--generate-notes" "false")
        fi

        if [ "$UPDATE_DRAFT" = "true" ]; then
          ARGS+=("--update-existing-draft" "true")
        else
          ARGS+=("--update-existing-draft" "false")
        fi

        if [ -n "$ARTIFACTS_PATTERN" ]; then
          ARGS+=("--artifacts" "$ARTIFACTS_PATTERN")
        fi

        if command -v python3 >/dev/null 2>&1; then
          python3 "${{ github.action_path }}/scripts/publish_release.py" "${ARGS[@]}"
        else
          python "${{ github.action_path }}/scripts/publish_release.py" "${ARGS[@]}"
        fi
