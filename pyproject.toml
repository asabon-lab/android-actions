[project]
name = "android-actions"
version = "0.1.0"
description = "Reusable GitHub Composite Actions for Android CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "asabon-lab" }
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (handled by line-length or manual formatting)
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["B"]

